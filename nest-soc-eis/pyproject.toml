[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-soc-eis"
version = "0.1.0"
description = "Physics-based impedance and transient simulation for solid oxide cells"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["solid oxide cells", "impedance", "EIS", "transients", "electrochemistry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
authors = [
    { name = "Javid Beyrami" },
    { name = "Rafael Nogueira Nakashima" }
]

maintainers = [
    { name = "Javid Beyrami" }
]
dependencies = [
    "nest-soc>=0.3.1",
    "numpy",
    "scipy",
    "matplotlib",
    "openpyxl"
]

[project.optional-dependencies]
dev = ["build", "pytest>=7.4", "twine"]
tutorial = ["jupyterlab"]

[project.urls]
Repository = "https://github.com/javidbe/nest-soc-eis"
Issues = "https://github.com/javidbe/nest-soc-eis/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nesteis", "nesteis.examples", "nesteis.examples.tutorials"]

[tool.setuptools.package-data]
"nesteis.examples" = ["tutorials/*.ipynb"]
