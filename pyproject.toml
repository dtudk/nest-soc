[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-soc"
version = "0.3.1"
description = "Modeling package for solid oxide cells as part of the NEST (Next-gen electrochemical system tools) project"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Rafael Nogueira Nakashima", email = "rafnn@dtu.dk" },
    { name = "Javid Beyrami", email = "jabey@dtu.dk"}]

maintainers = [
    { name = "Javid Beyrami", email = "jabey@dtu.dk" },
    { name = "Rafael Nogueira Nakashima", email = "rafnn@dtu.dk" }
]

dependencies = [
    "numpy>=2.3.2",
    "scipy>=1.16.2",
    "matplotlib>=3.10.6",
    "pandas>=2.3.1",
    "openpyxl",
    "ipython>=9.17.1",
]

keywords = [
    "sofc",
    "soec",
    "fuel cell",
    "electrolysis",
    "hydrogen",
    "degradation"
]

[project.urls]
Homepage = "https://github.com/dtudk/nest-soc"
Issues = "https://github.com/dtudk/nest-soc/issues"

[tool.setuptools.packages.find]
include = ["nest*"]

[tool.ty.src]
exclude = ["nest/examples/tutorials/**/*.ipynb"]

[dependency-groups]
dev = [
    {include-group = "docs"},
    {include-group = "notebook"},
    "deptry>=0.25.1",
    "build >= 1.3",
    "pytest>=7.4",
    "ruff>=0.6",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-autoapi>=3.8.1",
    "sphinx-copybutton>=0.5.2",
]
notebook = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
