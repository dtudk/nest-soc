# ruff.toml
extend-exclude = ["nest/_temp"]  # prototypes, not linted
force-exclude = true  # also when the path is passed explicitly (editors, pre-commit)

[lint]
preview = true
explicit-preview-rules = true          # only opt in to the preview rules named below
select = ["E", "F", "D4", "D417", "DOC201", "DOC102"]
ignore = ["E501", "D400", "D401"]

[lint.pydocstyle]
convention = "numpy"
